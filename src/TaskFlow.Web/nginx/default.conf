# Serves the SPA and proxies /api to the API container, so both share one origin:
# no CORS, and the SameSite=Strict refresh cookie is always sent.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port (e.g. localhost:8080), so absolute URLs the API builds
        # (the Location header on 201 Created) point back through this proxy.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/login, /register, …) all serve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
