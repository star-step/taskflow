# Serves the SPA and proxies /api to the API container, so both share one origin:
# no CORS, and the SameSite=Strict refresh cookie is always sent.

# Forward the client's Host (with its port, so Location headers point back here). HTTP/1.0 clients
# may send none; fall back to $host then, since the API rejects an empty Host header.
map $http_host $upstream_host {
    ""      $host;
    default $http_host;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/login, /register, …) all serve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
