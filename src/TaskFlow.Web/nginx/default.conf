# Serves the SPA and proxies /api to the API container, so both share one origin:
# no CORS, and the SameSite=Strict refresh cookie is always sent.

# Forward the client's Host (with its port, so Location headers point back here). HTTP/1.0 clients
# may send none; fall back to $host then, since the API rejects an empty Host header.
map $http_host $upstream_host {
    ""      $host;
    default $http_host;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;

    # nginx's own errors use the same ProblemDetails JSON shape as the API. Errors the API returns
    # itself pass through unchanged (proxy_intercept_errors is off), so these only apply when nginx
    # rejects a request or can't reach the API. $request_id (hex) is the traceId.
    error_page 413 = @payload_too_large;
    error_page 502 503 504 = @api_unavailable;

    location @payload_too_large {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/problem+json;
        return 413 '{"type":"https://tools.ietf.org/html/rfc9110#section-15.5.14","title":"Payload too large","status":413,"detail":"The request body is larger than 1 MB.","errorCode":"PAYLOAD_TOO_LARGE","traceId":"$request_id"}';
    }

    location @api_unavailable {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 10 always;
        default_type application/problem+json;
        return 503 '{"type":"https://tools.ietf.org/html/rfc9110#section-15.6.4","title":"Service unavailable","status":503,"detail":"The API is not reachable right now. Try again shortly.","errorCode":"API_UNAVAILABLE","traceId":"$request_id"}';
    }

    # Liveness/readiness come from the API, so a stopped API reads as unavailable, not as the SPA.
    location /health/ {
        proxy_pass http://api:8080;
        proxy_connect_timeout 5s;
        proxy_set_header Host $upstream_host;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_connect_timeout 5s; # report an unreachable API quickly instead of after 60 s
        proxy_http_version 1.1;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/login, /register, …) all serve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
